[project]
name = "whisper-mcp"
version = "0.1.0"
description = "Servidor MCP (mock) para transcripción de audio sobre faster-whisper/Speaches"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
