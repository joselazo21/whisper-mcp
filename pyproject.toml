[project]
name = "whisper-mcp"
version = "0.1.0"
description = "Servidor MCP de transcripción con trabajos persistentes en PostgreSQL y RabbitMQ"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2,<4",
    "aio-pika>=9.4,<10",
    "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
